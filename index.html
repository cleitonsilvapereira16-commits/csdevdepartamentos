<body class="min-h-screen flex flex-col items-center justify-center p-4">

            <button id="logoutBtn" class="bg-red-500/10 hover:bg-red-500/20 text-red-400 px-4 py-2 rounded-lg text-sm font-semibold border border-red-500/30">
                Sair
            </button>
        </header>

        <!-- IMPORTAÇÃO DE DEMANDAS -->
        <div class="card-bg p-6 rounded-xl space-y-4">
            <h3 class="text-lg font-bold text-slate-200 flex items-center gap-2">
                <span class="w-3 h-3 bg-cyan-400 rounded-full inline-block"></span>
                Importar e Enviar Demandas
            </h3>
            
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div>
                    <label class="block text-xs font-semibold uppercase text-slate-400 mb-1">Operador Destino</label>
                    <select id="targetOperator" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-3 text-sm text-slate-200 focus:border-cyan-500 outline-none">
                        <option value="Ludmila">Ludmila</option>
                        <option value="Lucas">Lucas</option>
                        <option value="Samantha">Samantha</option>
                        <option value="Artur">Artur</option>
                    </select>
                </div>
                <div>
                    <label class="block text-xs font-semibold uppercase text-slate-400 mb-1">Status Inicial</label>
                    <input type="text" id="initialStatus" value="Pendente" readonly class="w-full bg-slate-900/60 border border-slate-700 rounded-lg p-3 text-sm text-slate-400 cursor-not-allowed">
                </div>
            </div>

            <div>
                <label class="block text-xs font-semibold uppercase text-slate-400 mb-1">Lista de Nomes / Demanda (1 por linha)</label>
                <textarea id="importData" rows="6" placeholder="Cole aqui os dados dos clientes ou demandas...
Exemplo:
João Silva - Cobrança Pendente - (61) 99999-9999
Maria Santos - Regularização" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-3 text-sm text-slate-200 focus:border-cyan-500 outline-none"></textarea>

            <button id="btnProcessAndSend" class="w-full bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-bold py-3 rounded-lg transition-all duration-200 uppercase text-sm tracking-wider shadow-lg shadow-emerald-500/20">
                Processar e Enviar ao Supabase
            </button>
        </div>

    <!-- SCRIPT DE CONFIGURAÇÃO DO SUPABASE -->
    <script>
        // CONFIGURAÇÕES SUPABASE AJUSTADAS
        const SUPABASE_URL = "https://lgdngncxmlbtshclanzy.supabase.co";
        const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxnZG5nbmN4bWxidHNoY2xhbnp5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODcyMTIwNzgsImV4cCI6MjEwMjc4ODA3OH0.FSmfOpRQqeaEeRoGK1kQ-lRIyeG-DK6wp68wzB0mjcY";

        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // ELEMENTOS DOM
        const loginSection = document.getElementById('loginSection');
        const dashboardSection = document.getElementById('dashboardSection');
        const userSelect = document.getElementById('userSelect');
        const operatorId = document.getElementById('operatorId');
        const loginForm = document.getElementById('loginForm');
        const welcomeUser = document.getElementById('welcomeUser');
        const logoutBtn = document.getElementById('logoutBtn');
        const btnProcessAndSend = document.getElementById('btnProcessAndSend');

        // Mapeamento de IDs
        userSelect.addEventListener('change', (e) => {
            operatorId.value = e.target.value;
        });

        // Login Handler
        loginForm.addEventListener('submit', (e) => {
            e.preventDefault();
            const pin = document.getElementById('pinInput').value;
            if (userSelect.value === "121" && pin !== "9871") {
                alert("PIN incorreto para o Supervisor!");
                return;
            }
            loginSection.classList.add('hidden');
            dashboardSection.classList.remove('hidden');
            welcomeUser.textContent = `Painel - ${userSelect.options[userSelect.selectedIndex].text}`;
        });

        // Logout Handler
        logoutBtn.addEventListener('click', () => {
            dashboardSection.classList.add('hidden');
            loginSection.classList.remove('hidden');
        });

        // Envio de Demanda para o Supabase
        btnProcessAndSend.addEventListener('click', async () => {
            const rawData = document.getElementById('importData').value.trim();
            const targetOperator = document.getElementById('targetOperator').value;

            if (!rawData) {
                alert("Por favor, cole a lista de demandas antes de enviar.");
                return;
            }

            const lines = rawData.split('\n').filter(line => line.trim() !== "");
            const recordsToInsert = lines.map(line => ({
                operador: targetOperator,
                cliente: line.trim(),
                statusDemanda: "Pendente",
                demanda: line.trim()
            }));

            try {
                btnProcessAndSend.disabled = true;
                btnProcessAndSend.textContent = "Enviando...";

                const { data, error } = await supabase
                    .from('clientes')
                    .insert(recordsToInsert);

                if (error) {
                    throw error;
                }

                alert(`Sucesso! ${recordsToInsert.length} demanda(s) enviada(s) para ${targetOperator}.`);
                document.getElementById('importData').value = "";
            } catch (err) {
                console.error("Erro no Supabase:", err);
                alert("Erro ao salvar no banco: " + (err.message || err));
            } finally {
                btnProcessAndSend.disabled = false;
                btnProcessAndSend.textContent = "Processar e Enviar ao Supabase";
            }
        });
    </script>
</body>
</html
