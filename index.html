<!-- Barbearia Digital — painel de colaboradores, fila, agendamento e gestão -->
<style>
  :root{
    --preto:#141414; --preto-2:#232323;
    --branco:#FFFFFF;
    --cinza-050:#FAFAFA; --cinza-100:#F1F1F1; --cinza-200:#E4E4E4; --cinza-300:#D2D2D2;
    --cinza-400:#B3B3B3; --cinza-600:#7A7A7A; --cinza-800:#333333;
    --serif: ui-serif, Georgia, "Times New Roman", serif;
    --sans: ui-sans-serif, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  #bb-root{
    min-height:100%; color:var(--preto); font-family:var(--sans);
    background-color:var(--cinza-050);
    background-image:
      repeating-linear-gradient(135deg, rgba(0,0,0,.018) 0px, rgba(0,0,0,.018) 1px, transparent 1px, transparent 10px);
  }
  #bb-root *{ box-sizing:border-box; }
  .bb-mono{ font-variant-numeric:tabular-nums; }
  .bb-divider-stripes{ height:6px; background:repeating-linear-gradient(-45deg, var(--branco) 0 6px, var(--preto) 6px 12px); }

  /* ---------- topo com logo ---------- */
  .bb-top{
    position:relative; background:var(--preto); color:var(--branco); padding:22px 26px;
    display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:14px;
    background-image: repeating-linear-gradient(115deg, rgba(255,255,255,.025) 0 2px, transparent 2px 26px);
    box-shadow: inset 0 -1px 0 rgba(255,255,255,.06);
  }
  .bb-brand{ display:flex; align-items:center; gap:16px; }
  .bb-badge-name{ font-family:var(--serif); font-size:22px; letter-spacing:.05em; font-weight:700; margin:0; }
  .bb-badge-sub{ font-family:var(--serif); font-size:10px; letter-spacing:.32em; color:var(--cinza-400); text-transform:uppercase; margin-top:2px; }
  .bb-who{ display:flex; align-items:center; gap:9px; font-size:12.5px; color:var(--cinza-300); }
  .bb-who select{ background:var(--preto-2); color:var(--branco); border:1px solid #3a3a3a; border-radius:7px; padding:7px 10px; font-size:12.5px; }
  .bb-pill-dono{ background:var(--branco); color:var(--preto); font-size:10.5px; font-weight:800; padding:4px 10px; border-radius:999px; letter-spacing:.04em; text-transform:uppercase; box-shadow:0 2px 6px rgba(0,0,0,.25); }
  .bb-exit{ background:none; border:1px solid #3a3a3a; color:var(--cinza-300); border-radius:7px; padding:6px 9px; font-size:11px; cursor:pointer; }
  .bb-exit:hover{ border-color:var(--branco); color:var(--branco); }

  .bb-tabs{ background:var(--branco); border-bottom:1px solid var(--cinza-200); padding:0 26px; display:flex; gap:4px; box-shadow:0 1px 0 rgba(0,0,0,.02); overflow-x:auto; }
  .bb-tab{ padding:14px 18px; font-size:12.5px; font-weight:800; letter-spacing:.04em; text-transform:uppercase; color:var(--cinza-600); cursor:pointer; border-bottom:2px solid transparent; user-select:none; transition:color .15s ease, border-color .15s ease; white-space:nowrap; }
  .bb-tab:hover{ color:var(--preto); }
  .bb-tab.active{ color:var(--preto); border-bottom-color:var(--preto); }

  .bb-body{ padding:26px; max-width:1180px; margin:0 auto; }

  /* ---------- hero ---------- */
  .bb-hero{ text-align:center; padding:26px 10px 22px; }
  .bb-hero .kicker{ font-family:var(--serif); font-size:10.5px; letter-spacing:.4em; text-transform:uppercase; color:var(--cinza-600); }
  .bb-hero h1{ font-family:var(--serif); font-size:30px; letter-spacing:.02em; margin:6px 0 4px; }
  .bb-hero .tag{ font-size:12.5px; color:var(--cinza-600); font-style:italic; }
  .bb-hero-rule{ display:flex; align-items:center; gap:12px; max-width:340px; margin:16px auto 0; }
  .bb-hero-rule .ln{ flex:1; height:1px; background:var(--cinza-300); }
  .bb-hero-rule .diamond{ width:7px; height:7px; background:var(--preto); transform:rotate(45deg); }

  /* ---------- títulos de seção ---------- */
  .bb-section-title{ display:flex; align-items:center; gap:9px; font-family:var(--serif); font-size:15px; font-weight:700; letter-spacing:.03em; margin:26px 0 12px; color:var(--preto); }
  .bb-section-title .ic{ font-size:14px; }
  .bb-section-title::after{ content:""; flex:1; height:1px; background:linear-gradient(90deg, var(--cinza-300), transparent); }

  /* ---------- cartões de barbeiro ---------- */
  .bb-cards{ display:grid; grid-template-columns:repeat(auto-fit,minmax(230px,1fr)); gap:16px; margin-bottom:22px; }
  .bb-card{
    position:relative; overflow:hidden; background:var(--branco); border:1px solid var(--cinza-200); border-radius:14px;
    padding:18px 16px 16px; box-shadow:0 8px 20px rgba(0,0,0,.05); transition:transform .18s ease, box-shadow .18s ease;
  }
  .bb-card::before{ content:""; position:absolute; top:0; left:0; right:0; height:4px; background:repeating-linear-gradient(-45deg, var(--preto) 0 6px, var(--branco) 6px 12px); }
  .bb-card:hover{ transform:translateY(-3px); box-shadow:0 14px 28px rgba(0,0,0,.09); }
  .bb-card-top{ display:flex; align-items:center; gap:12px; margin-top:4px; }
  .bb-avatar{ width:46px; height:46px; border-radius:50%; background:var(--preto); color:var(--branco); display:flex; align-items:center; justify-content:center;
    font-family:var(--serif); font-weight:700; font-size:16px; flex:none; box-shadow:0 0 0 3px var(--branco), 0 0 0 4px var(--cinza-300); }
  .bb-card-name{ font-weight:800; font-size:14.5px; letter-spacing:.01em; }
  .bb-status{ display:inline-flex; align-items:center; gap:6px; font-size:10.5px; font-weight:800; padding:3px 10px; border-radius:999px; text-transform:uppercase; letter-spacing:.03em; margin-top:4px; }
  .bb-status::before{ content:""; width:6px; height:6px; border-radius:50%; background:currentColor; flex:none; }
  .bb-status.disponivel{ background:var(--branco); border:1.5px solid var(--preto); color:var(--preto); }
  .bb-status.disponivel::before{ animation:bb-pulse 1.6s infinite; }
  @keyframes bb-pulse{ 0%,100%{ opacity:1 } 50%{ opacity:.25 } }
  .bb-status.ocupado{ background:var(--cinza-300); color:var(--preto-2); }
  .bb-status.ausente{ background:var(--preto); color:var(--branco); }
  .bb-fila-row{ display:flex; align-items:center; justify-content:space-between; margin-top:14px; padding-top:12px; border-top:1px solid var(--cinza-200); }
  .bb-fila-lbl{ font-size:11.5px; color:var(--cinza-600); }
  .bb-fila-ctrl{ display:flex; align-items:center; gap:8px; }
  .bb-fila-num{ font-size:20px; font-weight:800; min-width:22px; text-align:center; }
  .bb-stepper{ width:26px; height:26px; border-radius:7px; border:1px solid var(--cinza-300); background:var(--branco); font-size:15px; font-weight:800; cursor:pointer; color:var(--preto); }
  .bb-stepper:hover{ background:var(--cinza-100); }
  .bb-card-actions{ display:flex; gap:8px; margin-top:12px; }

  /* ---------- controles do próprio colaborador ---------- */
  .bb-mypanel{ background:var(--branco); border:1px solid var(--cinza-200); border-radius:14px; padding:16px 18px; margin-bottom:20px; display:flex; flex-wrap:wrap; gap:16px; align-items:center; }
  .bb-mypanel .grp{ display:flex; align-items:center; gap:8px; font-size:12.5px; color:var(--cinza-600); }
  .bb-toggle{ display:inline-flex; border:1.5px solid var(--preto); border-radius:999px; overflow:hidden; }
  .bb-toggle button{ border:none; background:var(--branco); color:var(--preto); font-size:12px; font-weight:700; padding:6px 12px; cursor:pointer; }
  .bb-toggle button.on{ background:var(--preto); color:var(--branco); }

  /* ---------- seletor de data ---------- */
  .bb-date-nav{ display:flex; align-items:center; gap:10px; margin-bottom:16px; }
  .bb-date-nav button{ border:1px solid var(--cinza-300); background:var(--branco); border-radius:8px; padding:7px 11px; font-size:13px; cursor:pointer; }
  .bb-date-nav button:hover{ background:var(--cinza-100); }
  .bb-date-nav input[type=date]{ border:1px solid var(--cinza-300); border-radius:8px; padding:7px 10px; font-size:13px; background:var(--branco); }

  /* ---------- grade de horarios ---------- */
  .bb-grid-wrap{ overflow-x:auto; border:1px solid var(--cinza-200); border-radius:14px; background:var(--branco); box-shadow:0 8px 22px rgba(0,0,0,.05); }
  table.bb-grid{ border-collapse:collapse; width:100%; font-size:12.5px; }
  table.bb-grid th{ background:var(--preto); color:var(--branco); font-family:var(--serif); font-size:11.5px; letter-spacing:.06em; padding:12px 8px; position:sticky; top:0;
    background-image: repeating-linear-gradient(115deg, rgba(255,255,255,.03) 0 2px, transparent 2px 20px); }
  table.bb-grid th:first-child{ text-align:left; padding-left:16px; }
  table.bb-grid td{ border-bottom:1px solid var(--cinza-100); border-right:1px solid var(--cinza-100); padding:0; text-align:center; }
  table.bb-grid tbody tr:nth-child(even) td.bb-hora{ background:var(--cinza-100); }
  table.bb-grid td.bb-hora{ background:var(--cinza-050); font-weight:700; color:var(--cinza-800); padding:9px 14px; white-space:nowrap; border-left:3px solid var(--preto); }
  .bb-slot{ width:100%; height:100%; padding:10px 6px; cursor:default; font-size:11px; font-weight:800; letter-spacing:.02em; text-transform:uppercase; user-select:none; transition:background .12s ease; }
  .bb-slot.livre{ background:var(--branco); color:var(--cinza-400); }
  .bb-slot.ocupado{ background:var(--cinza-300); color:var(--preto-2); }
  .bb-slot.ausente{ background:var(--preto); color:var(--branco); }
  .bb-slot.clickable{ cursor:pointer; }
  .bb-slot.clickable:hover{ outline:2px solid var(--preto); outline-offset:-2px; filter:brightness(.96); }

  .bb-legend{ display:flex; gap:18px; margin:14px 2px 22px; font-size:11.5px; color:var(--cinza-600); flex-wrap:wrap; align-items:center; }
  .bb-legend .it{ display:flex; align-items:center; gap:7px; }
  .bb-legend .sw{ width:13px; height:13px; border-radius:4px; border:1px solid var(--cinza-300); box-shadow:0 1px 2px rgba(0,0,0,.06); }
  .sw.livre{ background:var(--branco); } .sw.ocupado{ background:var(--cinza-300); } .sw.ausente{ background:var(--preto); }

  /* ---------- gerenciar & formularios ---------- */
  .bb-panel{ position:relative; overflow:hidden; background:var(--branco); border:1px solid var(--cinza-200); border-radius:14px; padding:24px; margin-bottom:18px; box-shadow:0 8px 22px rgba(0,0,0,.05); }
  .bb-panel::before{ content:""; position:absolute; top:0; left:0; right:0; height:4px; background:repeating-linear-gradient(-45deg, var(--preto) 0 6px, var(--branco) 6px 12px); }
  .bb-panel h2{ font-family:var(--serif); font-size:15px; letter-spacing:.03em; color:var(--preto); margin:4px 0 18px; display:flex; align-items:center; gap:8px; }
  .bb-form-row{ display:grid; grid-template-columns:1fr 1fr 1fr; gap:12px; margin-bottom:14px; }
  .bb-field{ display:flex; flex-direction:column; gap:5px; }
  .bb-field label{ font-size:11.5px; font-weight:700; color:var(--cinza-600); }
  .bb-field input, .bb-field select{ border:1px solid var(--cinza-300); border-radius:8px; padding:8px 10px; font-size:13.5px; }
  .bb-field input:focus, .bb-field select:focus{ outline:2px solid var(--preto); outline-offset:1px; }
  .bb-btn{ border:none; border-radius:9px; padding:10px 18px; font-size:12.5px; font-weight:800; letter-spacing:.02em; cursor:pointer; transition:transform .08s ease, background .15s ease; }
  .bb-btn:active{ transform:scale(.97); }
  .bb-btn.primary{ background:var(--preto); color:var(--branco); box-shadow:0 4px 12px rgba(0,0,0,.18); }
  .bb-btn.primary:hover{ background:#000; }
  .bb-btn.ghost{ background:var(--branco); border:1px solid var(--cinza-300); color:var(--preto); }
  .bb-btn.ghost:hover{ background:var(--cinza-100); border-color:var(--cinza-400); }
  .bb-btn.danger{ background:var(--branco); border:1px solid var(--preto); color:var(--preto); }
  .bb-btn.danger:hover{ background:var(--preto); color:var(--branco); }
  .bb-list-row{ display:flex; align-items:center; justify-content:space-between; padding:12px 2px; border-bottom:1px solid var(--cinza-100); }
  .bb-list-row:last-child{ border-bottom:none; }
  .bb-list-row b{ font-family:var(--serif); font-size:14.5px; }
  .bb-tag-inativo{ font-size:10.5px; color:var(--cinza-600); border:1px solid var(--cinza-300); border-radius:999px; padding:2px 8px; margin-left:8px; }

  /* ---------- catálogo de cortes ---------- */
  .bb-cortes-grid{ display:grid; grid-template-columns:repeat(auto-fit,minmax(230px,1fr)); gap:16px; margin-bottom:10px; }
  .bb-corte-card{
    position:relative; overflow:hidden; background:var(--branco); border:1px solid var(--cinza-200); border-radius:14px;
    padding:22px 18px; text-align:center; box-shadow:0 8px 20px rgba(0,0,0,.05); transition:transform .18s ease, box-shadow .18s ease;
  }
  .bb-corte-card::before{ content:""; position:absolute; top:0; left:0; right:0; height:4px; background:repeating-linear-gradient(-45deg, var(--preto) 0 6px, var(--branco) 6px 12px); }
  .bb-corte-card:hover{ transform:translateY(-3px); box-shadow:0 14px 28px rgba(0,0,0,.09); }
  .bb-corte-num{
    width:38px; height:38px; margin:6px auto 12px; border-radius:50%; border:1.5px solid var(--preto);
    display:flex; align-items:center; justify-content:center; font-family:var(--serif); font-weight:700; font-size:14px;
  }
  .bb-corte-nome{ font-family:var(--serif); font-size:17px; font-weight:700; letter-spacing:.02em; }
  .bb-corte-linha{ width:34px; height:1px; background:var(--cinza-300); margin:10px auto 12px; }
  .bb-corte-desc{ font-size:12.5px; color:var(--cinza-600); line-height:1.55; }
  .bb-corte-preco{ margin-top:12px; font-weight:800; font-size:15px; color:var(--preto); }

  .bb-hint{ font-size:11.5px; color:var(--cinza-600); }
  .bb-ok{ background:var(--cinza-100); border:1px solid var(--cinza-300); border-radius:999px; padding:9px 14px; font-size:12.5px; margin-top:10px; display:inline-block; font-weight:700; }
  .bb-empty{ text-align:center; padding:40px; color:var(--cinza-600); font-size:13px; }
  .bb-loading{ padding:40px; text-align:center; color:var(--cinza-600); font-size:13px; }
  @media (max-width:720px){ .bb-form-row{ grid-template-columns:1fr; } .bb-body{ padding:14px; } }
</style>

<div id="bb-root">
  <div class="bb-top">
    <div class="bb-brand" id="bb-logo"></div>
    <div class="bb-who" id="bb-who"></div>
  </div>
  <div class="bb-tabs" id="bb-tabs"></div>
  <div class="bb-body" id="bb-body"><div class="bb-loading" id="bb-loading">Carregando…</div></div>
</div>

<script>
(function(){
  "use strict";
  const root = document.getElementById('bb-root');
  const body = document.getElementById('bb-body');
  const loading = document.getElementById('bb-loading');
  const logoBox = document.getElementById('bb-logo');
  const whoBox = document.getElementById('bb-who');
  const tabsBox = document.getElementById('bb-tabs');

  const DEFAULT_CONFIG = {
    nomeLoja:'Barbearia do Danilo', abertura:'09:00', fechamento:'19:00', slotMin:30,
    statusLoja:'aberto', // 'aberto' | 'reduzida' | 'fechada'
    cadeiras:3, cadeirasEmUso:0,
    sabado:{ ativo:true, abertura:'09:00', fechamento:'14:00' },
    domingo:{ ativo:false, abertura:'09:00', fechamento:'13:00' },
    localizacao:'', contato:'', instagram:''
  };
  const DEFAULT_BARBEIROS = [
    { nome:'JOÃO', ativo:true, disponivel:true, fila:0 },
    { nome:'PEDRO', ativo:true, disponivel:true, fila:0 },
  ];
  const DEFAULT_CORTES = [
    { nome:'Taper Fade', desc:'Transição suave e gradual da lateral bem rente até o topo, contorno natural e discreto — o mais versátil de todos.', preco:35 },
    { nome:'Low Fade', desc:'Degradê baixo, começa próximo à orelha e sobe pouco. Visual clássico, elegante e fácil de manter.', preco:35 },
    { nome:'Degradê', desc:'A transição tradicional entre lateral curta e topo mais longo, com acabamento suave em toda a extensão.', preco:35 },
    { nome:'Na Zero', desc:'Raspado bem rente à pele nas laterais e nuca, sem comprimento — visual limpo e de baixa manutenção.', preco:30 },
    { nome:'Militar', desc:'Curto e uniforme em todo o comprimento, sem contraste acentuado. Estilo prático, disciplinado e atemporal.', preco:30 },
  ];

  let config = {...DEFAULT_CONFIG};
  let barbeiros = [];
  let cortes = [];              // catálogo de cortes
  let agenda = {};              // { dateISO: { nome: { 'HH:MM': 'ocupado'|'ausente' } } }
  let agendamentos = [];        // reservas de clientes
  let meuNome = null;           // pessoal
  let roleMode = null;          // null (visitante) | 'dono' | 'gestor' | 'colaborador'
  let activeTab = 'painel';
  let selectedDate = todayISO();
  let storageOk = true;
  function isAdmin(){ return roleMode==='dono' || roleMode==='gestor'; }

  const $ = id => document.getElementById(id);
  const qsa = (sel, ctx) => Array.from((ctx||document).querySelectorAll(sel));
  function todayISO(){ return new Date().toISOString().slice(0,10); }
  function esc(s){ return (s==null?'':String(s)).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
  function initials(nome){ const p=(nome||'').trim().split(/\s+/); return ((p[0]||'')[0]||'').toUpperCase()+((p[1]||'')[0]||'').toUpperCase(); }
  function fmtDateLabel(iso){
    const d = new Date(iso+'T00:00:00');
    const dias = ['Domingo','Segunda','Terça','Quarta','Quinta','Sexta','Sábado'];
    const [y,m,dd] = iso.split('-');
    return `${dias[d.getDay()]}, ${dd}/${m}/${y}`;
  }
  function addDays(iso, n){ const d = new Date(iso+'T00:00:00'); d.setDate(d.getDate()+n); return d.toISOString().slice(0,10); }

  function horarioDoDia(dateISO){
    const dow = new Date(dateISO+'T00:00:00').getDay(); // 0=domingo, 6=sábado
    if(dow === 6) return config.sabado && config.sabado.ativo ? config.sabado : null;
    if(dow === 0) return config.domingo && config.domingo.ativo ? config.domingo : null;
    return { ativo:true, abertura:config.abertura, fechamento:config.fechamento };
  }
  function gerarSlots(dateISO){
    const h = horarioDoDia(dateISO || selectedDate);
    if(!h || !h.ativo) return [];
    const [ah,am] = h.abertura.split(':').map(Number);
    const [fh,fm] = h.fechamento.split(':').map(Number);
    let cur = ah*60+am; const fim = fh*60+fm; const passo = config.slotMin||30;
    const slots = [];
    while(cur < fim){ const hh = Math.floor(cur/60), mm = cur%60; slots.push(`${String(hh).padStart(2,'0')}:${String(mm).padStart(2,'0')}`); cur += passo; }
    return slots;
  }
  function slotStatus(nome, dateISO, hhmm){
    return (agenda[dateISO] && agenda[dateISO][nome] && agenda[dateISO][nome][hhmm]) || 'livre';
  }
  function setSlotStatus(nome, dateISO, hhmm, status){
    if(!agenda[dateISO]) agenda[dateISO] = {};
    if(!agenda[dateISO][nome]) agenda[dateISO][nome] = {};
    if(status === 'livre') delete agenda[dateISO][nome][hhmm];
    else agenda[dateISO][nome][hhmm] = status;
  }
  function escolherBarbeiroAutomatico(dateISO, hhmm){
    const candidatos = barbeiros.filter(b => b.ativo && b.disponivel && slotStatus(b.nome, dateISO, hhmm)==='livre');
    if(!candidatos.length) return null;
    candidatos.sort((a,b) => (a.fila||0)-(b.fila||0));
    return candidatos[0].nome;
  }

  // ---------- storage ----------
  async function loadAll(){
    try{ const c = await window.storage.get('barb-config', true); config = c&&c.value ? {...DEFAULT_CONFIG, ...JSON.parse(c.value)} : {...DEFAULT_CONFIG}; }catch(e){ config = {...DEFAULT_CONFIG}; }
    try{ const b = await window.storage.get('barb-colaboradores', true); barbeiros = b&&b.value ? JSON.parse(b.value) : DEFAULT_BARBEIROS.slice(); }catch(e){ barbeiros = DEFAULT_BARBEIROS.slice(); }
    try{ const k = await window.storage.get('barb-cortes', true); cortes = k&&k.value ? JSON.parse(k.value) : DEFAULT_CORTES.slice(); }catch(e){ cortes = DEFAULT_CORTES.slice(); }
    try{ const a = await window.storage.get('barb-agenda', true); agenda = a&&a.value ? JSON.parse(a.value) : {}; }catch(e){ agenda = {}; }
    try{ const g = await window.storage.get('barb-agendamentos', true); agendamentos = g&&g.value ? JSON.parse(g.value) : []; }catch(e){ agendamentos = []; }
    try{ const m = await window.storage.get('barb-meu-nome', false); meuNome = m&&m.value ? m.value : null; }catch(e){ meuNome = null; }
  }
  async function saveConfig(){ try{ await window.storage.set('barb-config', JSON.stringify(config), true); }catch(e){ storageOk=false; } }
  async function saveBarbeiros(){ try{ const r = await window.storage.set('barb-colaboradores', JSON.stringify(barbeiros), true); if(!r) storageOk=false; }catch(e){ storageOk=false; } }
  async function saveCortes(){ try{ const r = await window.storage.set('barb-cortes', JSON.stringify(cortes), true); if(!r) storageOk=false; }catch(e){ storageOk=false; } }
  async function saveAgenda(){ try{ const r = await window.storage.set('barb-agenda', JSON.stringify(agenda), true); if(!r) storageOk=false; }catch(e){ storageOk=false; } }
  async function saveAgendamentos(){ try{ const r = await window.storage.set('barb-agendamentos', JSON.stringify(agendamentos), true); if(!r) storageOk=false; }catch(e){ storageOk=false; } }
  async function saveMeuNome(n){ meuNome = n; try{ await window.storage.set('barb-meu-nome', n, false); }catch(e){} }

  async function tryEnterPin(storageKey, label){
    let rec; try{ rec = await window.storage.get(storageKey, true); }catch(e){ rec=null; }
    const stored = rec && rec.value ? rec.value : null;
    if(!stored){
      const p1 = prompt(`Nenhum PIN de ${label} definido ainda. Crie um PIN agora:`);
      if(!p1) return false;
      const p2 = prompt('Confirme o PIN:');
      if(p1 !== p2){ alert('Os PINs não conferem.'); return false; }
      try{ await window.storage.set(storageKey, p1, true); }catch(e){}
      return true;
    }
    const attempt = prompt(`Digite o PIN de ${label}:`);
    if(attempt === stored) return true;
    if(attempt !== null) alert('PIN incorreto.');
    return false;
  }

  function renderAgendar(){

            <div class="bb-field"><label>Bebida inclusa</label>
              <select id="a-bebida">
                <option value="Sem bebida">Sem bebida</option>
                <option value="Água para consumo">Água para consumo</option>
                <option value="Suco para consumo">Suco para consumo</option>
                <option value="Energético para consumo">Energético para consumo</option>
              </select>
            </div>
            <div class="bb-field"><label>Data</label><input type="date" id="a-data" value="${todayISO()}"></div>
          </div>
          <div class="bb-form-row">
            <div class="bb-field"><label>Horário desejado</label><select id="a-hora"></select></div>
          </div>
          <button type="submit" class="bb-btn primary" style="margin-top:8px;">Confirmar agendamento</button>
          <div id="a-msg"></div>
        </form>
      </div>
    `;

    function atualizarHorariosDisponiveis(){
      const dataIso = $('a-data').value || todayISO();
      const barbSel = $('a-barbeiro').value;
      const slots = gerarSlots(dataIso);
      const selectHora = $('a-hora');

      let livres = [];
      if(barbSel === '__auto'){
        livres = slots.filter(hhmm => escolherBarbeiroAutomatico(dataIso, hhmm) !== null);
      } else {
        livres = slots.filter(hhmm => slotStatus(barbSel, dataIso, hhmm) === 'livre');
      }

      if(!livres.length){
        selectHora.innerHTML = '<option value="">Sem horários disponíveis nesta data</option>';
      } else {
        selectHora.innerHTML = livres.map(h => `<option value="${h}">${h}</option>`).join('');
      }
    }

    $('a-data').addEventListener('change', atualizarHorariosDisponiveis);
    $('a-barbeiro').addEventListener('change', atualizarHorariosDisponiveis);
    atualizarHorariosDisponiveis();

    $('bb-form-agendar').addEventListener('submit', async e => {
      e.preventDefault();
      const cliente = $('a-nome').value.trim();
      const tel = $('a-tel').value.trim();
      const corteNome = $('a-corte').value;
      const bebida = $('a-bebida').value;
      const dataIso = $('a-data').value;
      const hora = $('a-hora').value;
      let barbSel = $('a-barbeiro').value;

      if(!hora){ alert('Por favor, escolha um horário disponível.'); return; }

      if(barbSel === '__auto'){
        barbSel = escolherBarbeiroAutomatico(dataIso, hora);
        if(!barbSel){ alert('Não há barbeiros disponíveis para este horário.'); return; }
      } else {
        if(slotStatus(barbSel, dataIso, hora) !== 'livre'){
          alert('Horário ocupado para este barbeiro. Por favor escolha outro.');
          return;
        }
      }

      setSlotStatus(barbSel, dataIso, hora, 'ocupado');
      const corteObj = cortes.find(c=>c.nome===corteNome);
      const valor = corteObj ? corteObj.preco : 0;

      agendamentos.push({
        id: Date.now(), cliente, tel, corte: corteNome, valor, bebida,
        barbeiro: barbSel, data: dataIso, hora, criadoEm: new Date().toISOString()
      });

      await saveAgenda();
      await saveAgendamentos();

      $('a-msg').innerHTML = `<div class="bb-ok">✔ Agendamento confirmado para ${esc(barbSel)} às ${hora} no dia ${fmtDateLabel(dataIso)}!</div>`;
      $('bb-form-agendar').reset();
      $('a-data').value = todayISO();
      atualizarHorariosDisponiveis();
    });
  }

              </thead>
              <tbody>
                ${agendamentos.slice().reverse().map(a => `
                  <tr>
                    <td class="bb-hora" style="border-left:none; padding:8px 12px;">${a.data} — ${a.hora}</td>
                    <td style="padding:8px 12px;"><b>${esc(a.cliente)}</b></td>
                    <td style="padding:8px 12px;">${esc(a.tel||'—')}</td>
                    <td style="padding:8px 12px;">${esc(a.corte)}</td>
                    <td style="padding:8px 12px;"><b>R$ ${(a.valor||0).toFixed(2)}</b></td>
                    <td style="padding:8px 12px;">${esc(a.bebida||'Sem bebida')}</td>
                    <td style="padding:8px 12px;">${esc(a.barbeiro)}</td>
                    <td style="padding:8px 12px;">
                      <button class="bb-btn danger" data-cancel-agend="${a.id}" style="padding:4px 8px; font-size:11px;">Cancelar</button>
                    </td>
                  </tr>
                `).join('')}
              </tbody>
            </table>
          </div>
        ` : '<div class="bb-empty">Nenhum agendamento realizado até o momento.</div>'}
      </div>
    `;

    qsa('[data-cancel-agend]').forEach(btn => btn.addEventListener('click', async () => {
      const id = Number(btn.dataset.cancelAgend);
      const idx = agendamentos.findIndex(a=>a.id===id);
      if(idx<0) return;
      if(!confirm('Deseja realmente cancelar este agendamento?')) return;
      const item = agendamentos[idx];
      setSlotStatus(item.barbeiro, item.data, item.hora, 'livre');
      agendamentos.splice(idx,1);
      await saveAgenda();
      await saveAgendamentos();
      renderAgendamentos();
    }));
  }

  // ---------- gerenciar (dono) ----------
  function renderGerenciar(){
    const sab = config.sabado || { ativo:true, abertura:'09:00', fechamento:'14:00' };
    const dom = config.domingo || { ativo:false, abertura:'09:00', fechamento:'13:00' };

    body.innerHTML = `
      <div class="bb-panel">
        <h2><span class="ic">🏛</span>Dados da barbearia</h2>
        <div class="bb-form-row">
          <div class="bb-field"><label>Nome da barbearia</label><input id="g-nome" value="${esc(config.nomeLoja)}"></div>
          <div class="bb-field"><label>Abertura padrão (seg - sex)</label><input id="g-abertura" type="time" value="${config.abertura}"></div>
          <div class="bb-field"><label>Fechamento padrão (seg - sex)</label><input id="g-fechamento" type="time" value="${config.fechamento}"></div>
        </div>
        <div class="bb-form-row">
          <div class="bb-field"><label>Cadeiras de corte</label><input id="g-cadeiras" type="number" min="1" max="20" value="${config.cadeiras||3}"></div>
          <div class="bb-field"><label>Duração de cada horário (min)</label>
            <select id="g-slot"><option value="15" ${config.slotMin==15?'selected':''}>15</option><option value="30" ${config.slotMin==30?'selected':''}>30</option><option value="45" ${config.slotMin==45?'selected':''}>45</option><option value="60" ${config.slotMin==60?'selected':''}>60</option></select>
          </div>
        </div>
        <div class="bb-form-row">
          <div class="bb-field"><label>Localização (Google Maps)</label><input id="g-loc" value="${esc(config.localizacao||'')}" placeholder="Ex.: Rua das Flores, 123"></div>
          <div class="bb-field"><label>Contato WhatsApp</label><input id="g-contato" value="${esc(config.contato||'')}" placeholder="Ex.: 11999999999"></div>
          <div class="bb-field"><label>Instagram (@da_loja)</label><input id="g-insta" value="${esc(config.instagram||'')}" placeholder="Ex.: barbeariadodanilo"></div>
        </div>
        <button class="bb-btn primary" id="g-salvar-config">Salvar configuração</button>
        <div id="g-config-msg"></div>
      </div>

      <div class="bb-panel">
        <h2><span class="ic">🗓</span>Cronograma de fim de semana</h2>
        <div class="bb-form-row">
          <div class="bb-field"><label>Sábado funciona?</label>
            <select id="g-sab-ativo"><option value="1" ${sab.ativo?'selected':''}>Sim</option><option value="0" ${!sab.ativo?'selected':''}>Não</option></select>
          </div>
          <div class="bb-field"><label>Abertura sábado</label><input id="g-sab-ab" type="time" value="${sab.abertura}"></div>
          <div class="bb-field"><label>Fechamento sábado</label><input id="g-sab-fe" type="time" value="${sab.fechamento}"></div>
        </div>
        <div class="bb-form-row">
          <div class="bb-field"><label>Domingo funciona?</label>
            <select id="g-dom-ativo"><option value="1" ${dom.ativo?'selected':''}>Sim</option><option value="0" ${!dom.ativo?'selected':''}>Não</option></select>
          </div>
          <div class="bb-field"><label>Abertura domingo</label><input id="g-dom-ab" type="time" value="${dom.abertura}"></div>
          <div class="bb-field"><label>Fechamento domingo</label><input id="g-dom-fe" type="time" value="${dom.fechamento}"></div>
        </div>
        <button class="bb-btn primary" id="g-salvar-fds">Salvar cronograma de fim de semana</button>
        <div id="g-fds-msg"></div>
      </div>

      <div class="bb-panel">
        <h2><span class="ic">✂</span>Colaboradores</h2>
        <div id="g-lista">
          ${barbeiros.map(b => `
            <div class="bb-list-row">
              <div><b>${esc(b.nome)}</b> ${!b.ativo?'<span class="bb-tag-inativo">inativo</span>':''}</div>
              <div style="display:flex; gap:8px;">
                <button class="bb-btn ghost" data-toggle-ativo="${esc(b.nome)}">${b.ativo?'Desativar':'Reativar'}</button>
                <button class="bb-btn danger" data-remover="${esc(b.nome)}">Remover</button>
              </div>
            </div>`).join('') || '<div class="bb-hint">Nenhum colaborador cadastrado ainda.</div>'}
        </div>
        <div class="bb-form-row" style="margin-top:16px;">
          <div class="bb-field full" style="grid-column:1/3;"><label>Novo colaborador</label><input id="g-novo-nome" placeholder="Nome do barbeiro"></div>
          <div class="bb-field" style="align-self:end;"><button class="bb-btn primary" id="g-add-colab">Adicionar</button></div>
        </div>
      </div>

      <div class="bb-panel">
        <h2><span class="ic">📋</span>Catálogo de cortes &amp; valores</h2>
        <div id="g-lista-cortes">
          ${cortes.map((c,i) => `
            <div class="bb-list-row">
              <div><b>${esc(c.nome)}</b> — R$ ${(c.preco||0).toFixed(2)}<div class="bb-hint">${esc(c.desc)}</div></div>
              <button class="bb-btn danger" data-remover-corte="${i}">Remover</button>
            </div>`).join('') || '<div class="bb-hint">Nenhum corte cadastrado ainda.</div>'}
        </div>
        <div class="bb-form-row" style="margin-top:16px; grid-template-columns:1fr 1fr 2fr auto;">
          <div class="bb-field"><label>Nome do corte</label><input id="g-novo-corte-nome" placeholder="Ex.: Undercut"></div>
          <div class="bb-field"><label>Valor (R$)</label><input id="g-novo-corte-preco" type="number" step="0.01" placeholder="35.00"></div>
          <div class="bb-field"><label>Descrição</label><input id="g-novo-corte-desc" placeholder="Breve descrição do estilo"></div>
          <div class="bb-field" style="align-self:end;"><button class="bb-btn primary" id="g-add-corte">Adicionar</button></div>
        </div>
      </div>
    `;

    $('g-salvar-config').addEventListener('click', async () => {
      config.nomeLoja = $('g-nome').value.trim()||'Barbearia';
      config.abertura = $('g-abertura').value||'09:00';
      config.fechamento = $('g-fechamento').value||'19:00';
      config.cadeiras = Number($('g-cadeiras').value)||3;
      config.slotMin = Number($('g-slot').value);
      config.localizacao = $('g-loc').value.trim();
      config.contato = $('g-contato').value.trim();
      config.instagram = $('g-insta').value.trim();
      await saveConfig();
      renderLogo();
      $('g-config-msg').innerHTML = '<div class="bb-ok">✔ Configurações da barbearia salvas.</div>';
    });

    $('g-salvar-fds').addEventListener('click', async () => {
      config.sabado = { ativo: $('g-sab-ativo').value==='1', abertura: $('g-sab-ab').value||'09:00', fechamento: $('g-sab-fe').value||'14:00' };
      config.domingo = { ativo: $('g-dom-ativo').value==='1', abertura: $('g-dom-ab').value||'09:00', fechamento: $('g-dom-fe').value||'13:00' };
      await saveConfig();
      $('g-fds-msg').innerHTML = '<div class="bb-ok">✔ Cronograma de fim de semana atualizado.</div>';
    });

    qsa('[data-toggle-ativo]').forEach(btn => btn.addEventListener('click', async () => {
      const idx = barbeiros.findIndex(b=>b.nome===btn.dataset.toggleAtivo); if(idx<0) return;
      barbeiros[idx].ativo = !barbeiros[idx].ativo; await saveBarbeiros(); renderGerenciar();
    }));
    qsa('[data-remover]').forEach(btn => btn.addEventListener('click', async () => {
      if(!confirm(`Remover ${btn.dataset.remover} definitivamente?`)) return;
      barbeiros = barbeiros.filter(b=>b.nome!==btn.dataset.remover); await saveBarbeiros(); renderGerenciar();
    }));
    $('g-add-colab').addEventListener('click', async () => {
      const nome = $('g-novo-nome').value.trim().toUpperCase();
      if(!nome){ alert('Informe o nome.'); return; }
      if(barbeiros.some(b=>b.nome===nome)){ alert('Já existe um colaborador com esse nome.'); return; }
      barbeiros.push({ nome, ativo:true, disponivel:true, fila:0 });
      await saveBarbeiros(); renderGerenciar();
    });
    qsa('[data-remover-corte]').forEach(btn => btn.addEventListener('click', async () => {
      const i = Number(btn.dataset.removerCorte);
      if(!confirm(`Remover "${cortes[i].nome}" do catálogo?`)) return;
      cortes.splice(i,1); await saveCortes(); renderGerenciar();
    }));
    $('g-add-corte').addEventListener('click', async () => {
      const nome = $('g-novo-corte-nome').value.trim();
      const preco = Number($('g-novo-corte-preco').value)||0;
      const desc = $('g-novo-corte-desc').value.trim();
      if(!nome){ alert('Informe o nome do corte.'); return; }
      cortes.push({ nome, preco, desc: desc || 'Sem descrição cadastrada.' });
      await saveCortes(); renderGerenciar();
    });
  }

  // ---------- boot ----------
  async function boot(){
    renderLogo();
    renderWho();
    renderTabs();
    renderBody();
    if(!storageOk && !document.querySelector('.bb-boot-warn')){
      const w = document.createElement('div'); w.className='bb-hint bb-boot-warn';
      w.style.cssText='padding:8px 24px; background:#F1F1F1;'; w.textContent='Aviso: não foi possível salvar de forma persistente neste ambiente.';
      root.insertBefore(w, tabsBox.nextSibling);
    }
  }
  (async function init(){
    await loadAll();
    loading.remove();
    roleMode = meuNome ? 'colaborador' : null;
    await boot();
  })();
})();
</script>
